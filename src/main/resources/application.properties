
spring.application.name=aerosaga-backend

server.port=${PORT:9091}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# Temporal Server connection
temporal.service.target=100.113.203.51:7233
temporal.namespace=default

# Workflow polling interval: 2 seconds
temporal.mission.poll-interval-ms=2000
temporal.droneid=DRONE-01
